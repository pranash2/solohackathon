<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Drawing Robot</title>
    <style>
      body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; }
      #wrap { display: flex; gap: 24px; align-items: flex-start; }
      canvas { border: 2px solid #111; border-radius: 8px; touch-action: none; }
      .panel { min-width: 280px; }
      button { padding: 10px 12px; border-radius: 8px; border: 1px solid #111; background: #fff; cursor: pointer; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      .row { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
      .small { font-size: 12px; color: #444; }
      pre { background: #f6f6f6; padding: 12px; border-radius: 8px; overflow: auto; }
      label { display: inline-flex; gap: 8px; align-items: center; }
      input[type="range"] { width: 180px; }
    </style>
  </head>
  <body>
    <h2>Drawing Robot</h2>
    <div class="small">Draw inside the box. Click “Send to robot” to generate an 8×8 plan.</div>

    <div id="wrap">
      <div>
        <canvas id="c" width="480" height="480"></canvas>
        <div class="row">
          <button id="clearBtn">Clear</button>
          <button id="sendBtn">Send to robot</button>
        </div>
        <div class="row">
          <label>Brush
            <input id="brush" type="range" min="2" max="24" value="8" />
            <span id="brushVal">8</span>px
          </label>
          <label>
            <input id="snap" type="checkbox" checked />
            Snap to 8×8 preview
          </label>
        </div>
      </div>

      <div class="panel">
        <h3>Backend response</h3>
        <pre id="out">{}</pre>
        <div class="small">
          Backend URL: <code id="apiUrl"></code>
        </div>
      </div>
    </div>

    <script>
      // ===== Config =====
      const API_BASE = "http://localhost:5000"; // change if backend runs elsewhere
      document.getElementById("apiUrl").textContent = API_BASE;

      // ===== Canvas draw =====
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let drawing = false;
      let last = null;

      const brush = document.getElementById("brush");
      const brushVal = document.getElementById("brushVal");
      brush.addEventListener("input", () => brushVal.textContent = brush.value);

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches && e.touches[0];
        const clientX = touch ? touch.clientX : e.clientX;
        const clientY = touch ? touch.clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function drawLine(a, b) {
        ctx.strokeStyle = "black";
        ctx.lineWidth = parseInt(brush.value, 10);
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }

      function onDown(e) {
        e.preventDefault();
        drawing = true;
        last = getPos(e);
      }
      function onMove(e) {
        if (!drawing) return;
        e.preventDefault();
        const p = getPos(e);
        drawLine(last, p);
        last = p;
        if (document.getElementById("snap").checked) renderGridOverlay();
      }
      function onUp(e) {
        e.preventDefault();
        drawing = false;
        last = null;
        if (document.getElementById("snap").checked) renderGridOverlay();
      }

      canvas.addEventListener("mousedown", onDown);
      canvas.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);

      canvas.addEventListener("touchstart", onDown, { passive: false });
      canvas.addEventListener("touchmove", onMove, { passive: false });
      window.addEventListener("touchend", onUp, { passive: false });

      // ===== Optional grid overlay preview =====
      function renderGridOverlay() {
        // Draw faint grid lines on top without permanently altering drawing:
        // We do it by copying to an offscreen buffer, then re-rendering.
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
        ctx.putImageData(img, 0, 0);

        const n = 8;
        ctx.save();
        ctx.strokeStyle = "rgba(0,0,0,0.15)";
        ctx.lineWidth = 1;
        for (let i = 1; i < n; i++) {
          const x = (canvas.width * i) / n;
          const y = (canvas.height * i) / n;
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
        }
        ctx.restore();
      }

      // ===== Buttons =====
      document.getElementById("clearBtn").onclick = () => {
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        document.getElementById("out").textContent = "{}";
      };

      document.getElementById("sendBtn").onclick = async () => {
        const btn = document.getElementById("sendBtn");
        btn.disabled = true;

        try {
          // Export canvas as PNG base64
          const image_b64 = canvas.toDataURL("image/png");

          const resp = await fetch(`${API_BASE}/plan`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image_b64,
              grid_n: 8
            }),
          });

          const data = await resp.json();
          document.getElementById("out").textContent = JSON.stringify(data, null, 2);

          // Optional: call execute immediately (stub for now)
          if (data.cells && data.cells.length > 0) {
            await fetch(`${API_BASE}/execute`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ cells: data.cells }),
            });
          }
        } catch (err) {
          document.getElementById("out").textContent = `Error: ${err}`;
        } finally {
          btn.disabled = false;
        }
      };
    </script>
  </body>
</html>
